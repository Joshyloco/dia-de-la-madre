<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día de la Madre</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(-45deg, #ff758c, #ff7eb3, #fad0c4, #fcb69f);
            background-size: 400% 400%;
            animation: fondo 8s ease infinite;
        }

        @keyframes fondo {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .contenedor {
            text-align: center;
            color: white;
            z-index: 10;
            animation: entrada 2s ease;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: latido 2s infinite;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.3);
        }

        p {
            font-size: 1.5rem;
            margin-bottom: 25px;
        }

        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 30px;
            background: white;
            color: #ff4f81;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
            background: #ffe4ec;
        }

        @keyframes entrada {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes latido {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .flor {
            position: absolute;
            top: -10%;
            font-size: 2rem;
            animation: caer linear forwards;
        }

        @keyframes caer {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>🌸 Feliz Día Mamá 🌸</h1>
        <p>Gracias por tu amor, apoyo y ternura infinita 💖</p>
        <button onclick="mostrarMensaje()">Mensaje especial</button>
    </div>

    <script>
        function mostrarMensaje() {
            alert("Mamá, gracias por ser mi guía, mi fuerza y mi mayor bendición. ¡Te amo! 💕");
        }

        function crearFlor() {
            const flor = document.createElement("div");
            flor.classList.add("flor");
            flor.innerHTML = "🌸";

            flor.style.left = Math.random() * window.innerWidth + "px";
            flor.style.animationDuration = (Math.random() * 4 + 3) + "s";
            flor.style.fontSize = (Math.random() * 20 + 20) + "px";

            document.body.appendChild(flor);

            setTimeout(() => {
                flor.remove();
            }, 7000);
        }

        setInterval(crearFlor, 250);
    </script>

</body>
</html>
